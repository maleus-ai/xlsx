[workspace]
members = ["crates/xlsx-core", "crates/xlsx-node"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/maleus-ai/xlsx"

[workspace.dependencies]
calamine = "0.36.1"
zip = { version = "8.6", default-features = false, features = ["deflate"] }

[profile.release]
strip = true
lto = true
codegen-units = 1

# Inflating a 200 MB archive under an unoptimised zlib takes seconds, which
# would make the test suite about the build profile rather than about the code.
# Dependencies are optimised; our own crates stay debuggable.
[profile.dev.package."*"]
opt-level = 3
