name: Tests

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [master, main]

# Nothing here writes anything. Stated rather than inherited, so that a change
# to the repository default cannot quietly widen what a third-party action in
# these jobs is allowed to do.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust
    runs-on: blacksmith-4vcpu-ubuntu-2204
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable, 1.95
        with:
          toolchain: "1.95"
          components: clippy, rustfmt

      # The fixtures are not committed: they are rebuilt from
      # `fixtures/generate.mjs`, which is also what keeps them honest.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24

      - name: Cache cargo registry & target
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.2.3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: tests-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: tests-cargo-

      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Build fixtures
        run: node fixtures/generate.mjs

      - run: cargo test --workspace

      # The core must stay buildable, and testable, without a Node runtime in
      # its dependency tree. This is the check that keeps decision 3 true rather
      # than merely intended.
      - name: The core carries no binding
        run: |
          count=$(cargo tree -p xlsx-core | grep -c napi || true)
          test "$count" -eq 0 || { echo "xlsx-core depends on napi"; exit 1; }

  node:
    name: Node
    runs-on: blacksmith-4vcpu-ubuntu-2204
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable, 1.95
        with:
          toolchain: "1.95"

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.2.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm

      - name: Cache cargo registry & target
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.2.3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: node-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: node-cargo-

      - run: pnpm install --frozen-lockfile

      # Released, not debug: the suite asserts a peak RSS and an event loop that
      # keeps its cadence, and neither figure means anything unoptimised.
      - run: pnpm run build

      - name: Build fixtures
        run: node fixtures/generate.mjs

      - run: pnpm test

      # `binding.js` and `binding.d.ts` are generated from the Rust source and
      # committed, because the publish job assembles the package without
      # building it. A stale copy would ship an API that does not exist.
      # `napi pre-publish` publishes the platform packages on its own. Reached
      # through a lifecycle hook it runs once per `npm publish`, and the release
      # then tries to publish what it has already put out.
      - name: The manifest declares no publish-time script
        run: |
          node -e '
            const s = require("./crates/xlsx-node/package.json").scripts ?? {};
            const hooks = ["prepublish", "prepublishOnly", "prepare", "prepack", "postpublish"];
            const found = hooks.filter((h) => s[h]);
            if (found.length) {
              console.error(`publishing must run no lifecycle script; found: ${found.join(", ")}`);
              process.exit(1);
            }
          '

      - name: The generated binding is in sync
        run: git diff --exit-code -- crates/xlsx-node/binding.js crates/xlsx-node/binding.d.ts

  alpine:
    name: node:24-alpine (production target)
    runs-on: blacksmith-4vcpu-ubuntu-2204
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24

      - name: Build fixtures
        run: node fixtures/generate.mjs

      # `x86_64-unknown-linux-musl` is not one target among five: the generated
      # applications deploy on `node:24-alpine`, pinned `linux/amd64`. Building
      # it inside Alpine links it against the libc it will actually run on.
      - name: Build the musl binary
        run: ./scripts/build-musl.sh

      - name: Load and read it in the deployment image
        run: |
          docker run --rm --platform linux/amd64 -v "$PWD:/work" -w /work node:24-alpine \
            node scripts/smoke-alpine.mjs
