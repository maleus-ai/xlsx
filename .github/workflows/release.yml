name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v0.1.0). Leave empty for an artifact-only build."
        required: false
      linux-gnu-x86_64:
        description: "x86_64-unknown-linux-gnu"
        type: boolean
        default: true
      linux-gnu-aarch64:
        description: "aarch64-unknown-linux-gnu"
        type: boolean
        default: true
      linux-musl-x86_64:
        description: "x86_64-unknown-linux-musl (production target)"
        type: boolean
        default: true
      linux-musl-aarch64:
        description: "aarch64-unknown-linux-musl"
        type: boolean
        default: true
      macos-aarch64:
        description: "aarch64-apple-darwin"
        type: boolean
        default: true

# Read-only by default. The two jobs below run third-party actions, a Rust
# toolchain and pnpm lifecycle scripts; none of that needs to write anything.
# `publish` raises what it needs, and only there.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Build matrix
        id: set-matrix
        run: |
          TARGETS='[]'
          add() { TARGETS=$(echo "$TARGETS" | jq -c ". + [$1]"); }

          if [[ "${{ github.event_name }}" == "push" || "${{ inputs.linux-gnu-x86_64 }}" == "true" ]]; then
            add '{"target":"x86_64-unknown-linux-gnu","runner":"blacksmith-4vcpu-ubuntu-2204","builder":"napi","arch":"x64","packages":"pkg-config g++ make"}'
          fi
          if [[ "${{ github.event_name }}" == "push" || "${{ inputs.linux-gnu-aarch64 }}" == "true" ]]; then
            add '{"target":"aarch64-unknown-linux-gnu","runner":"blacksmith-4vcpu-ubuntu-2204-arm","builder":"napi","arch":"arm64","packages":"pkg-config g++ make"}'
          fi
          if [[ "${{ github.event_name }}" == "push" || "${{ inputs.linux-musl-x86_64 }}" == "true" ]]; then
            add '{"target":"x86_64-unknown-linux-musl","runner":"blacksmith-4vcpu-ubuntu-2204","builder":"alpine","arch":"x64","packages":""}'
          fi
          if [[ "${{ github.event_name }}" == "push" || "${{ inputs.linux-musl-aarch64 }}" == "true" ]]; then
            add '{"target":"aarch64-unknown-linux-musl","runner":"blacksmith-4vcpu-ubuntu-2204-arm","builder":"alpine","arch":"arm64","packages":""}'
          fi
          if [[ "${{ github.event_name }}" == "push" || "${{ inputs.macos-aarch64 }}" == "true" ]]; then
            add '{"target":"aarch64-apple-darwin","runner":"macos-15","builder":"napi","arch":"arm64","packages":""}'
          fi

          echo "matrix={\"include\":$TARGETS}" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    if: ${{ fromJSON(needs.prepare.outputs.matrix).include[0] != null }}
    strategy:
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}

    steps:
      # Every action is pinned to a commit, not a tag and certainly not a
      # branch: this job's output is a native binary that goes on to run
      # unsandboxed inside every application that reads an upload.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0

      # The musl addon is built inside Alpine, from an image pinned by digest —
      # see scripts/build-musl.sh for why it is not cross-compiled.
      - name: Build the addon (musl, in Alpine)
        if: matrix.builder == 'alpine'
        run: ./scripts/build-musl.sh ${{ matrix.arch }}

      - name: Install Rust
        if: matrix.builder == 'napi'
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable, 1.95
        with:
          toolchain: "1.95"
          targets: ${{ matrix.target }}

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.2.0
        if: matrix.builder == 'napi'

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: matrix.builder == 'napi'
        with:
          node-version: 24
          cache: pnpm

      - name: Install build dependencies
        if: matrix.builder == 'napi' && runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.packages }}

      - name: Cache cargo registry & target
        if: matrix.builder == 'napi'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.2.3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: release-${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: release-${{ matrix.target }}-cargo-

      - name: Install dependencies
        if: matrix.builder == 'napi'
        run: pnpm install --frozen-lockfile

      - name: Build the addon
        if: matrix.builder == 'napi'
        working-directory: crates/xlsx-node
        run: pnpm exec napi build --platform --release --target ${{ matrix.target }} --js binding.js --dts binding.d.ts

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bindings-${{ matrix.target }}
          path: crates/xlsx-node/*.node
          if-no-files-found: error

  publish:
    needs: build
    if: github.ref_type == 'tag'
    # GitHub-hosted, not blacksmith. Trusted publishing attests provenance, and
    # npm refuses a bundle built anywhere else: "Unsupported GitHub Actions
    # runner environment: self-hosted". Blacksmith runners are self-hosted as far
    # as that check is concerned. Nothing here compiles — it downloads the
    # binaries the build jobs made and publishes them — so there is nothing to
    # miss.
    runs-on: ubuntu-latest
    permissions:
      contents: write # the GitHub release
      id-token: write # npm provenance
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.2.0
      # No `registry-url`, deliberately. It writes an `.npmrc` line reading the
      # auth token from `NODE_AUTH_TOKEN`, and with trusted publishing there is
      # no token: npm would find an empty credential and stop rather than fall
      # back to the OIDC exchange.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: crates/xlsx-node/artifacts
          pattern: bindings-*
          merge-multiple: true

      - name: List binaries
        run: ls -lh crates/xlsx-node/artifacts

      # One npm package per triple, each constrained by `os`, `cpu` and `libc`,
      # plus the root package that lists them as optional dependencies. A
      # platform nobody built for installs nothing and fails when the
      # application loads the module — at boot, not part way through an import.
      - name: Assemble the platform packages
        working-directory: crates/xlsx-node
        run: |
          pnpm exec napi create-npm-dirs
          pnpm exec napi artifacts
          # Last, and it has to be last. It writes the root package's
          # optionalDependencies — which cannot be committed, because they name
          # packages that do not exist until this step creates them — and that
          # edit puts `package.json` out of step with the lockfile. `pnpm exec`
          # checks the two agree before it runs anything, so any pnpm command
          # after this point fails with ERR_PNPM_OUTDATED_LOCKFILE.
          node ../../scripts/prepare-npm-packages.mjs

      # Published here rather than through `napi pre-publish`, which publishes the
      # platform packages itself unless told not to — and would then have this
      # step publish them a second time, mid-release, after five of the six were
      # already out. What it does beyond that, `napi artifacts` and
      # `prepare-npm-packages.mjs` have already done.
      #
      # Trusted publishing: npm exchanges this job's OIDC token for a short-lived
      # credential, so there is no secret in the repository to leak or rotate,
      # and provenance is attested without asking. It needs npm 11.5.1 or newer —
      # Node 24 ships 11.6 — and a trusted publisher configured on npmjs.com for
      # each of the six packages. Until that is in place this step fails with
      # `ENEEDAUTH`, having published nothing.
      #
      # `--ignore-scripts`, so that publishing runs nothing but the upload. A
      # lifecycle script here would run six times over — once per package — and
      # `napi pre-publish` in one of them publishes all five platform packages
      # by itself, which is how a release once got half out before failing on a
      # version the registry had already staged.
      #
      # The platform packages go first: the root resolves them by name.
      - name: Publish
        working-directory: crates/xlsx-node
        run: |
          for dir in npm/*/; do
            npm publish "$dir" --access public --ignore-scripts
          done
          npm publish --access public --ignore-scripts

      - name: GitHub release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.4.1
        with:
          files: crates/xlsx-node/artifacts/*.node
          generate_release_notes: true
